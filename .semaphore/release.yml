version: v1.0
name: release
agent:
  machine:
    type: f1-standard-2
    os_image: ubuntu2404

blocks:
  - name: release
    task:
      secrets:
        - name: rubygems-deploy
      jobs:
        - name: gem push
          commands:
            - checkout --use-cache
            - sem-version ruby 3.4 -f
            - VERSION=$(ruby -e "puts Gem::Specification.load('renuocop.gemspec').version")
            - test "$VERSION" = "$SEMAPHORE_GIT_TAG_NAME"
            - gem build renuocop.gemspec
            - gem push renuocop-$VERSION.gem
